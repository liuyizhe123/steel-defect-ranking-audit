# Capacity-matched P3/P4 control: no P2 or P5 detection level.
nc: 6
depth_multiple: 1.0
width_multiple: 1.0
reg_max: 16

backbone:
  - [-1, 1, Conv, [16, 3, 2]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, C2f, [32, True]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 2, C2f, [64, True]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C2f, [128, True]]
  - [-1, 1, SPPF, [128, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C2f, [64, True]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 1, C2f, [128, True]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 5, C2f, [256, True]]
  - [[10, 15], 1, Detect, [nc]]
